<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Checkerboard pattern for transparent background metaphor -->
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1e293b" fill-opacity="0.4" />
      <rect x="10" width="10" height="10" fill="#334155" fill-opacity="0.3" />
      <rect y="10" width="10" height="10" fill="#334155" fill-opacity="0.3" />
      <rect x="10" y="10" width="10" height="10" fill="#1e293b" fill-opacity="0.4" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-2deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes shimmerPill {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #38bdf888); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #c084fcdd); }
      }
      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 6s ease-in-out infinite; }
      .dynamic-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .dynamic-orb-2 { animation: pulseOrb 6s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .dynamic-pill { animation: shimmerPill 4s ease-in-out infinite; }
      .animated-stream { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
      .scan-beam { animation: scanline 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Sci-Fi Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="100" r="280" fill="url(#glowLeft)" class="dynamic-orb-1" />
  <circle cx="1000" cy="300" r="320" fill="url(#glowRight)" class="dynamic-orb-2" />
  <circle cx="600" cy="210" r="240" fill="url(#glowCenter)" />

  <!-- Cyber Grid Lines in Background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Connecting Data Streams -->
  <path d="M 50 80 Q 250 20 450 90 T 850 60 T 1150 110" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" class="animated-stream" />
  <path d="M 30 340 Q 300 390 600 320 T 1170 350" fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="2" class="animated-stream" />

  <!-- Decorative Left Card (Illustration of Alpha Matting / Segmentation Mask) -->
  <g class="floating-card-1" transform="translate(60, 110)">
    <rect width="170" height="200" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#boxShadow)" />
    <!-- Checkerboard segment cutout simulation -->
    <rect x="15" y="15" width="140" height="170" rx="10" fill="url(#checker)" stroke="#475569" stroke-opacity="0.5" />
    <!-- Silhouette isolated subject -->
    <path d="M 85 45 C 72 45 62 55 62 68 C 62 80 71 90 85 90 C 99 90 108 80 108 68 C 108 55 98 45 85 45 Z M 85 98 C 65 98 48 115 48 135 L 48 165 L 122 165 L 122 135 C 122 115 105 98 85 98 Z" fill="url(#cyanPurple)" />
    <!-- Dynamic Scanning Beam inside card -->
    <line x1="15" y1="15" x2="155" y2="15" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)" class="scan-beam" />
    <text x="85" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="600" letter-spacing="1">MASK ISOLATION</text>
  </g>

  <!-- Decorative Right Card (SAM 2 & Interactive Edge Graph) -->
  <g class="floating-card-2" transform="translate(970, 110)">
    <rect width="170" height="200" rx="16" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="15" y="15" width="140" height="170" rx="10" fill="#090d16" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.5" />
    <!-- Polygon Segmentation Points -->
    <polygon points="50,60 120,40 140,110 95,155 35,130" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-width="2" />
    <circle cx="50" cy="60" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="120" cy="40" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="140" cy="110" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="95" cy="155" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="35" cy="130" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="85" y="175" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="600" letter-spacing="1">SAM 2 PROMPT</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, & Tech Badges (Crisp and permanently in foreground) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 65)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" class="dynamic-pill" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" />
    <text x="6" y="5" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME CURATED LIST</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 140)">
    <text x="0" y="0" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" filter="url(#boxShadow)">
      Image Segmentation &amp; Background Removal
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0.2">
      State-of-the-Art Deep Learning Models, Matting Networks, Foundation Segmentors &amp; Commercial SaaS
    </text>
  </g>

  <!-- Tech Feature Pills (Dynamic Glow in Foreground) -->
  <g transform="translate(600, 245)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" class="dynamic-pill" />
      <text x="0" y="5" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✂️ Rembg &amp; U2-Net</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" class="dynamic-pill" />
      <text x="0" y="5" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎯 BiRefNet / DIS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#2e1065" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" class="dynamic-pill" />
      <text x="0" y="5" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ SAM 2 &amp; Grounding</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(160, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#3b0764" fill-opacity="0.9" stroke="#f472b6" stroke-width="1.2" class="dynamic-pill" />
      <text x="0" y="5" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 WebGPU / Client</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(320, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="1.2" class="dynamic-pill" />
      <text x="0" y="5" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎬 Video Matting</text>
    </g>
  </g>

  <!-- Quick Highlight Metrics Row -->
  <g transform="translate(600, 315)">
    <text x="-210" y="0" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⭐ 125,000+ GitHub Stars</text>
    <text x="-80" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">•</text>
    <text x="0" y="0" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🚀 30+ Curated Repos &amp; Models</text>
    <text x="110" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">•</text>
    <text x="210" y="0" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🏢 Top Enterprise SaaS</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#titleGrad)" />
</svg>
